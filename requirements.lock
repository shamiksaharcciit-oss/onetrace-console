# What this console runs on, every distribution pinned by its sha256. Install with:
#
#   python tools/install_pinned.py
#
# which is `pip install --require-hashes -r requirements.lock --report <path>`. The report lets the
# console name the exact SDK build a comparison ran with (`onetrace_console.compare.sdk_build_digest()`).
# A plain `pip install` works as well: the console then names the build from the installed files.
#
# onetrace 0.7.1 and onetrace-verify 0.7.1 from PyPI, each pinned by the sha256 of every file PyPI
# lists for it, its wheel's then its sdist's, read from PyPI's own JSON. onetrace 0.7.1 asks for
# onetrace-verify >=0.7.1,<0.8. No credentials are needed to install them. See PINS.md for the history.
