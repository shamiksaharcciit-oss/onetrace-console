# The test suite, on Linux and on Windows, Python 3.12, for every push and pull request.
#
# Read-only: no secrets (checkout uses GitHub's automatic per-run token, read-only here, and does not
# keep it), no pull_request_target, nothing scheduled. Every action is pinned by its full commit SHA,
# the version in a comment. Everything installed is hash-checked: the test tools from
# requirements-test.txt, the console's pins from requirements.lock (through tools/install_pinned.py),
# and the SDK's fixtures and wheel cache from PyPI.

name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python 3.12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: src
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"

      - name: The test tools, hash-checked (requirements-test.txt)
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: The console's pins, hash-checked (requirements.lock, through install_pinned.py)
        run: python tools/install_pinned.py

      - name: The SDK fixtures, then their check
        run: |
          python tools/fetch_sdk_fixtures.py
          python tools/fetch_sdk_fixtures.py --check

      - name: The wheel cache, then its check
        run: |
          python tools/fetch_wheel_cache.py
          python tools/fetch_wheel_cache.py --check

      - name: The suite
        run: >-
          python -B -m pytest -p no:cacheprovider -p no:randomly
          --basetemp="$RUNNER_TEMP/test-bt" tests -rsxX
